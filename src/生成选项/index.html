<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 9px 10px;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      }
      .option-panel {
        --panel: #1c1222;
        --surface: #29182c;
        --text: #f8edf4;
        --muted: #c6aabd;
        --pink: #f49cc4;
        width: 100%;
        max-width: 860px;
        margin: 0 auto;
        overflow: hidden;
        border: 1px solid #9c55758c;
        border-radius: 18px;
        background:
          radial-gradient(circle at 95% 0%, #7135566b, transparent 40%),
          linear-gradient(145deg, #302039, var(--panel) 66%);
        box-shadow:
          0 10px 28px #12081742,
          inset 0 1px #ffffff1c;
        color: var(--text);
      }
      .option-summary {
        display: flex;
        align-items: center;
        gap: 11px;
        min-height: 49px;
        padding: 10px 15px;
        list-style: none;
        cursor: pointer;
        user-select: none;
      }
      .option-summary::-webkit-details-marker {
        display: none;
      }
      .sigil {
        display: grid;
        flex: none;
        place-items: center;
        width: 29px;
        height: 29px;
        border: 1px solid #e991bc9c;
        border-radius: 9px;
        background: #7f335f55;
        color: #ffbdd9;
        font-size: 18px;
        line-height: 1;
        box-shadow: 0 0 15px #d34c8838;
      }
      .summary-copy {
        display: flex;
        flex: 1;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 10px;
        min-width: 0;
      }
      .summary-title {
        color: #ffd1e4;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.08em;
      }
      .summary-subtitle {
        color: var(--muted);
        font-size: 11px;
      }
      .summary-count {
        flex: none;
        padding: 3px 8px;
        border: 1px solid #dc83ac77;
        border-radius: 999px;
        color: #ffc5dd;
        font-size: 10px;
        font-variant-numeric: tabular-nums;
      }
      .summary-chevron {
        flex: none;
        color: var(--pink);
        font-size: 16px;
        transition: transform 0.2s ease;
      }
      .option-panel:not([open]) .summary-chevron {
        transform: rotate(-90deg);
      }
      .option-summary:hover .summary-title,
      .option-summary:focus-visible .summary-title {
        color: #fff4f8;
      }
      .option-summary:focus-visible,
      .action-btn:focus-visible {
        outline: 2px solid #ffc0da;
        outline-offset: -3px;
      }
      .button-group {
        display: grid;
        gap: 8px;
        padding: 3px 12px 13px;
      }
      .action-btn {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        min-width: 0;
        min-height: 43px;
        padding: 9px 12px;
        border: 1px solid #7c4b6b;
        border-radius: 11px;
        background: linear-gradient(105deg, #40233b, var(--surface) 60%);
        box-shadow: inset 0 1px #ffffff12;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        text-align: left;
        transition:
          background 0.18s ease,
          border-color 0.18s ease,
          box-shadow 0.18s ease,
          transform 0.18s ease;
      }
      .action-btn:hover {
        transform: translateY(-1px);
        border-color: #e987b4;
        background: linear-gradient(105deg, #643052, #382039 65%);
        box-shadow:
          0 5px 15px #10081655,
          inset 0 1px #ffffff1c;
      }
      .action-btn:active {
        transform: translateY(0);
      }
      .option-number {
        display: grid;
        flex: none;
        place-items: center;
        width: 26px;
        height: 26px;
        border: 1px solid #dc83ac7a;
        border-radius: 8px;
        color: #ffb6d4;
        font-size: 11px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .option-text {
        flex: 1;
        min-width: 0;
        font-size: 12px;
        line-height: 1.55;
        white-space: pre-line;
        overflow-wrap: anywhere;
      }
      .option-arrow {
        flex: none;
        color: #de8cb3;
        font-size: 16px;
      }
      .action-btn.active {
        border-color: #f3a4c7;
        background: linear-gradient(105deg, #783657, #4d2545 70%);
      }
      .action-btn.active .option-number {
        background: #d34c88;
        color: white;
      }
      .empty-state {
        padding: 5px 6px 8px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
      @media (max-width: 520px) {
        body {
          padding: 7px 5px;
        }
        .option-panel {
          border-radius: 14px;
        }
        .option-summary {
          padding: 9px 11px;
        }
        .summary-subtitle {
          display: none;
        }
        .button-group {
          padding: 3px 9px 10px;
        }
        .action-btn {
          gap: 9px;
          padding: 8px 10px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .option-panel *,
        .option-panel *::before,
        .option-panel *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <textarea id="op-source" hidden>$1</textarea>
    <details class="option-panel" open>
      <summary class="option-summary">
        <span class="sigil" aria-hidden="true">✦</span>
        <span class="summary-copy">
          <span class="summary-title">命运分歧</span>
          <span class="summary-subtitle">选择下一步行动</span>
        </span>
        <span class="summary-count" id="option-count"></span>
        <span class="summary-chevron" aria-hidden="true">⌄</span>
      </summary>
      <div class="button-group" id="dynamic-buttons"></div>
    </details>
    <script>
      function normalizeOptionText(rawText) {
        return rawText
          .replace(/\r\n?/g, '\n')
          .replace(/\\n/g, '\n')
          .replace(/<br\s*\/?>/gi, '\n')
          .split('\n')
          .map(line => line.replace(/[ \t\f\v]+/g, ' ').trim())
          .join('\n')
          .replace(/\n{3,}/g, '\n\n')
          .trim();
      }

      const container = document.getElementById('dynamic-buttons');
      const source = document.getElementById('op-source').value;
      const options = [...source.matchAll(/<op>([\s\S]*?)<\/op>/gi)]
        .map(match => normalizeOptionText(match[1]))
        .filter(Boolean);
      document.getElementById('option-count').textContent = `${options.length} 个选项`;

      if (options.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = '暂无可用选项';
        container.appendChild(empty);
      }

      options.forEach((text, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'action-btn';
        const number = document.createElement('span');
        number.className = 'option-number';
        number.textContent = String(index + 1).padStart(2, '0');
        const label = document.createElement('span');
        label.className = 'option-text';
        label.textContent = text;
        const arrow = document.createElement('span');
        arrow.className = 'option-arrow';
        arrow.setAttribute('aria-hidden', 'true');
        arrow.textContent = '↗';
        button.append(number, label, arrow);
        button.addEventListener('click', () => {
          try {
            const input = window.parent.document.querySelector('#send_textarea');
            if (!input) {
              console.warn('未找到酒馆输入框 #send_textarea');
              return;
            }
            const current = input.value.trim();
            input.value = current ? `${current} ${text}` : text;
            input.dispatchEvent(new Event('input', { bubbles: true }));
            input.focus();
            button.classList.add('active');
          } catch (error) {
            console.error('写入选项失败', error);
          }
        });
        container.appendChild(button);
      });
    </script>
  </body>
</html>
